name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app.py analytics.py theme.py metric_audit.py evidence_views.py finance_controls.py asset_controls.py asset_views.py scripts exercises tests
      - name: Validate formulas and financial controls
        run: python -m unittest discover -s tests -v

